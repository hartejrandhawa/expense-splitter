spring:
  application:
    name: expense-splitter

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_splitter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    # Keep DB sessions inside the service layer; services declare their own transactions.
    open-in-view: false
    show-sql: false

server:
  port: ${PORT:8080}

jwt:
  # Dev-only default. Always set JWT_SECRET (32+ random bytes) anywhere real.
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
  expiration-ms: 86400000  # 24 hours

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
